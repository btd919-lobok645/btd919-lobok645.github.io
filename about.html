<!DOCTYPE html>                             <!-- 이 문서가 HTML임을 선언. 항상 첫 줄 -->
<html lang="ko">                            <!-- 문서 시작. lang="ko"는 한국어 문서라는 표시 -->
<head>                                      <!-- 화면에 안 보이는 설정 영역 -->
  <meta charset="UTF-8">                    <!-- 한글이 깨지지 않게 하는 문자 인코딩 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
                                            <!-- 모바일에서 화면 크기에 맞춰 표시되도록 하는 설정 -->
  <title>회사소개 | 환진 (桓辰)</title>      <!-- 브라우저 탭에 표시되는 이름. 페이지마다 다르게 -->
  <link rel="stylesheet" href="style.css">  <!-- 외부 CSS 파일을 불러옴. 이 한 줄로 스타일 적용 -->
</head>

<body>                                      <!-- 실제로 화면에 보이는 내용 시작 -->

  <!-- 헤더: 모든 페이지에 동일하게 들어감 -->
  <header>
    <img src="logo.svg" alt="환진 로고" width="120">
                                            <!-- src=파일 경로, alt=이미지가 안 뜰 때 읽히는 설명 -->
    <div>                                   <!-- 글자 세 줄을 한 덩어리로 묶는 상자. Flexbox에서 로고 옆에 배치됨 -->
      <h1>환진 (桓辰)</h1>                   <!-- 페이지 대표 제목. 한 페이지에 하나만 -->
      <p class="mission">변화하는 시대 속에서 혁신을 이끄는 중심으로 서다.</p>
                                            <!-- class는 CSS에서 골라 꾸미기 위한 이름표 -->
      <p class="slogan">창의적인 사고와 혁신적인 기술로 새로운 세상과 연결하는 기업</p>
    </div>
  </header>

  <!-- 메뉴: 모든 페이지에 동일하게 들어감 -->
  <nav>                                     <!-- nav는 "여기가 메뉴다"라고 알려주는 태그 -->
    <a href="index.html">홈</a>              <!-- a는 링크 태그. href에 이동할 파일 이름 -->
    <a href="about.html">회사소개</a>
    <a href="products.html">제품소개</a>
    <a href="log.html">작업기록</a>
  </nav>

  <!-- 본문: 페이지마다 달라지는 부분 -->
  <main>
    <h2>사명</h2>                            <!-- h2는 큰 항목 제목. 여러 개 사용 가능 -->
    <p>변화하는 시대 속에서 혁신을 이끄는 중심으로 서다.</p>
                                            <!-- p는 문단 -->

    <h2>슬로건</h2>
    <p>창의적인 사고와 혁신적인 기술로 새로운 세상과 연결하는 기업</p>

    <h2>사명(社名)의 뜻</h2>
    <p>환진(桓辰) — 준비 중입니다.</p>

    <h2>사업 분야</h2>
    <p>준비 중입니다.</p>
  </main>

  <!-- 푸터: 모든 페이지에 동일하게 들어감 -->
  <footer>
    <p>&copy; 2026 환진 (桓辰)</p>           <!-- &copy;는 저작권 기호 ©를 나타내는 표기 -->
  </footer>

</body>
</html>
