<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>내 첫 홈페이지</title>
</head>
  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.7;
      color: #333;
    }
    header {
      display: flex;
      align-items: center;
      gap: 24px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 20px;
      margin-bottom: 30px;
    }
    header h1 {
      margin: 0;
      border-bottom: none;
      padding-bottom: 0;
    }
    .slogan {
      margin: 6px 0 0;
      color: #666;
      font-size: 15px;
    }
  </style>
<body>
  <header>
    <img src="logo.svg" alt="환진 로고" width="120">
    <div>
      <h1>안녕하세요</h1>
      <p class="slogan">창의적인 사고와 혁신적인 기술로<br>새로운 세상과 연결하는 기업</p>
    </div>
  </header>
</body>
</html>
