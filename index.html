<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일에서 화면 크기에 맞게 조절되도록 하는 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>환진 (桓辰)</title>

  <style>
    /* ===== 전체 기본 설정 ===== */
    body {
      font-family: sans-serif;      /* 고딕 계열 글꼴 */
      max-width: 700px;             /* 글이 너무 넓게 퍼지지 않도록 제한 */
      margin: 40px 60px;            /* 위아래 여백 40px, 좌우는 가운데 정렬 */
      padding: 0 20px;              /* 좌우 안쪽 여백 (화면이 좁을 때 글자가 붙는 것 방지) */
      line-height: 1.7;             /* 줄 간격 */
      color: #333;                  /* 글자색 (완전 검정보다 부드러움) */
    }

    /* ===== 헤더: 로고 + 제목/슬로건 ===== */
    header {
      display: flex;                /* 안에 든 요소들을 가로로 나란히 배치 */
      align-items: center;          /* 세로 방향 가운데 정렬 */
      gap: 24px;                    /* 로고와 글자 사이 간격 */
      border-bottom: 1px solid #ddd;/* 아래 구분선 */
      padding-bottom: 20px;         /* 구분선까지의 여백 */
      margin-bottom: 30px;          /* 구분선 아래 본문까지의 여백 */
    }

    header h1 {
      margin: 0;                    /* 기본 여백 제거 (헤더 안에서는 불필요) */
      color: #1a5490;               /* 제목 파란색 */
      font-size: 30px;
    }

    /* class="slogan" 이 붙은 요소만 골라서 꾸밈 */
    .slogan {
      margin: 6px 0 0;              /* 위쪽만 6px 띄우고 나머지는 0 */
      color: #666;                  /* 회색 (제목보다 덜 강조) */
      font-size: 15px;
    }

    /* ===== 본문 ===== */
    main h2 {
      color: #1a5490;
      font-size: 20px;
      margin-top: 32px;
      border-bottom: 2px solid #1a5490;
      padding-bottom: 8px;
    }

    /* ===== 푸터: 맨 아래 정보 ===== */
    footer {
      margin-top: 50px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
      font-size: 14px;
      color: #888;
    } 
  </style>
</head>

<body>

  <!-- 헤더: 모든 페이지에 공통으로 들어갈 부분 -->
  <header>
    <img src="logo.svg" alt="환진 로고" width="120">
    <div>
      <h1>환진 (桓辰)</h1>
      <p class="slogan">창의적인 사고와 혁신적인 기술로 새로운 세상과 연결하는 기업</p>
      <p class="mission">변화하는 시대 속에서 혁신을 이끄는 중심으로 서다.</p>
    </div>
  </header>

  <!-- 본문: 페이지마다 달라지는 부분 -->
  <main>

    <h2>사명</h2>
    <p>변화하는 시대 속에서 혁신을 이끄는 중심으로 서다.</p>

    <h2>슬로건</h2>
    <p>창의적인 사고와 혁신적인 기술로 새로운 세상과 연결하는 기업</p>

    <h2>준비 중입니다</h2>
    <p>연습용으로 만든 첫 번째 홈페이지입니다.</p>
    <p>개인 자료 및 사업용 홈페이지를 미리 준비하려고 합니다.</p>

  </main>

  <!-- 푸터: 모든 페이지에 공통으로 들어갈 부분 -->
  <footer>
    <p>&copy; 2026 환진 (桓辰)</p>
  </footer>

</body>
</html>
